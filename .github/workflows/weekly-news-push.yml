name: Jam City Weekly News Push

on:
  schedule:
    # Saturday 10:00 Iran time (UTC+3:30).
    - cron: "30 6 * * 6"
  workflow_dispatch:

jobs:
  send-weekly-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install push sender
        run: npm install --no-save web-push@3.6.7 --ignore-scripts

      - name: Send weekly Jam City news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: node scripts/send_weekly_news_push.js
