name: Publish Gold Business Wall Ads

on:
  schedule:
    # Iran is UTC+03:30 in September 2026: 09:00 => 05:30 UTC, 21:00 => 17:30 UTC.
    - cron: "30 5 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: gold-wall-ads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish next gold business ad
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROMO_ACTOR_ID: ${{ secrets.PROMO_ACTOR_ID }}
        run: node scripts/publish-gold-wall-ad.js
