name: Clean old public wall media

on:
  schedule:
    # Daily at 03:20 UTC (06:50 Iran time).
    - cron: "20 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: clean-old-wall-media
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Remove wall media older than seven days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-old-wall-media.js
